# XcodeGen spec. On a Mac with XcodeGen installed (`brew install xcodegen`),
# run `xcodegen generate` in this directory to produce FitCoach.xcodeproj,
# then open it in Xcode. See README.md.
name: FitCoach
options:
  bundleIdPrefix: app.fitcoach
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  FitCoach:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: FitCoach
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fitcoach.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"

  FitCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FitCoach
